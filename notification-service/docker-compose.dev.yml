# Standalone dev setup for the notification service only (NOT the team's system; that is the
# docker-compose.yml at the repo root).
#   DB + Mailpit  :  docker compose -f docker-compose.dev.yml up -d
#   + the service :  docker compose -f docker-compose.dev.yml --profile app up -d --build
# Caught emails: http://localhost:8025
name: notification-service
services:
  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification_dev
    ports:
      - "5434:5432"          # 5433 is reservation's, 5432 the team's
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # optional: the service also creates the tables itself
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: notification-mailpit
    ports:
      - "1025:1025"          # SMTP
      - "8025:8025"          # web UI

  notification-service:
    profiles: ["app"]
    build:
      context: ..                         # repo root, like the gateway
      dockerfile: notification-service/Dockerfile
    container_name: notification-service-dev
    environment:
      DATABASE_URL: postgresql://notification:notification_dev@notification-db:5432/notification
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8004:8000"                       # not 8001 (user) or 8003 (reservation)
    depends_on:
      notification-db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  notification_pgdata: