name: mycima

services:
  postgres:
    image: postgres:16
    container_name: mycima-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Other services (gateway, movie, reservation, payment, notification,
  # ai-assistant) are added here by their owners.
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: mycima-user-service
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+psycopg://user_svc:user_svc_pass@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mycima.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-MyCima Admin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
