name: mycima

services:
  postgres:
    image: postgres:16
    container_name: mycima-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Other services (gateway, movie, reservation, payment, notification,
  # ai-assistant) are added here by their owners.
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: mycima-user-service
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+psycopg://user_svc:user_svc_pass@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mycima.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-MyCima Admin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  movie-service:
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    container_name: mycima-movie-service
    environment:
      DATABASE_URL: postgresql+psycopg://movie_svc:movie_svc_pass@postgres:5432/movies_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      SEED_ON_STARTUP: "true"
      SEED_DAYS: ${SEED_DAYS:-10}
      CINEMA_TIMEZONE: Africa/Casablanca
      POSTER_CACHE_DIR: /data/posters
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8003:8000"
    volumes:
      - movie-posters:/data/posters
    depends_on:
      postgres:
        condition: service_healthy

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    container_name: mycima-reservation-service
    environment:
      DATABASE_URL: postgresql://reservation_svc:reservation_svc_pass@postgres:5432/reservation_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      MOVIE_LOOKUP: http
      MOVIE_SERVICE_URL: http://movie-service:8000
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      MAX_SEATS_PER_HOLD: ${MAX_SEATS_PER_HOLD:-8}
      CLEANUP_INTERVAL_SECONDS: 30
      NOTIFICATION_ENABLED: "true"
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      movie-service:
        condition: service_started
      notification-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: mycima-payment-service
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+psycopg://payment_svc:payment_svc_pass@postgres:5432/payment_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      REST_PORT: "8000"
      GRPC_PORT: "50051"
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      DEFAULT_CURRENCY: MAD
      SUPPORTED_CURRENCIES: MAD,USD,EUR
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Host 8004 is the reservation service, so the payment REST API gets 8006.
      - "8006:8000"     # REST (also used through the gateway)
      - "50052:50051"   # gRPC, host access for local debugging
    depends_on:
      postgres:
        condition: service_healthy
      reservation-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: mycima-notification-service
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://notification_svc:notification_svc_pass@postgres:5432/notification_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      EMAIL_FROM: no-reply@mycima.local
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 8004 is the reservation service; notification gets 8007.
      - "8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mycima-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox for caught emails

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: mycima-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8000
      MOVIE_SERVICE_URL: http://movie-service:8000
      RESERVATION_SERVICE_URL: http://reservation-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      AI_SERVICE_URL: http://ai-assistant-service:8000
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - movie-service
      - reservation-service
      - payment-service
      - notification-service
      - ai-assistant-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mycima-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  ai-assistant-service:
    build:
      context: .
      dockerfile: ai-assistant-service/Dockerfile
    container_name: mycima-ai-assistant-service
    env_file:
      - ./ai-assistant-service/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_svc:ai_svc_pass@postgres:5432/ai_assistant_db
      JWT_SECRET: ${JWT_SECRET:-mycima-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      GATEWAY_INTERNAL_URL: http://gateway:8000/api
      CINEMA_TIMEZONE: Africa/Casablanca
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8005:8000"
    # The gateway depends on this service, so we cannot depend on it back (compose cycle).
    # Calls to the gateway are retried/503-handled at runtime.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  movie-posters:
